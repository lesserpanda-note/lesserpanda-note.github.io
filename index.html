<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lesserpanda-note · Java · Spring · AI</title>
  <meta name="description" content="Java, Spring Boot, AI 최신 뉴스와 직접 정리한 인사이트" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>" />
</head>
<body>
  <header class="site-header">
    <h1>🐼 lesserpanda-note</h1>
    <p class="tagline">Java · Spring Boot · AI — 최신 뉴스 &amp; 인사이트</p>
    <p class="updated" id="updated"></p>
  </header>

  <main>
    <section id="insights" class="panel">
      <h2>📝 내 인사이트</h2>
      <div id="notes" class="notes"></div>
    </section>

    <section id="news" class="panel">
      <div class="panel-head">
        <h2>📰 최신 뉴스</h2>
        <div class="filters" id="filters"></div>
      </div>
      <div id="news-list" class="news-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>RSS 자동 수집 · 6시간마다 갱신 ·
      <a href="https://github.com/lesserpanda-note/lesserpanda-note.github.io">GitHub</a>
    </p>
  </footer>

  <script src="assets/app.js" defer></script>
</body>
</html>
