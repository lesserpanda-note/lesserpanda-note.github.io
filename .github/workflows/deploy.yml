name: build-and-deploy

# Pages "Source: GitHub Actions". One workflow regenerates the data and deploys
# the whole site. The accumulated news feed is committed back so it survives
# across runs; that commit is path-ignored and marked [skip ci] so it never
# re-triggers a deploy (no loop).
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/news.json"        # our own news commits must not re-trigger a deploy
  schedule:
    - cron: "0 */6 * * *"        # refresh news every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write               # commit the accumulated news.json back to the repo
  pages: write
  id-token: write
  issues: write                 # file an issue when the deploy ultimately fails

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # backstop: a hung feed fails fast instead of stalling ~30 min
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news (RSS)
        run: python scripts/fetch_news.py

      - name: Persist accumulated news
        run: |
          if [ -n "$(git status --porcelain data/news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "chore: accumulate news feed [skip ci]"
            git push origin HEAD:main
          else
            echo "news.json unchanged; nothing to commit"
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages occasionally rejects a deployment with a transient
      # "Deployment failed, try again later." — retry once before giving up,
      # otherwise the digest stays unpublished until the next scheduled run.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying failed deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Deploys dispatched by promote-digest run as the github-actions bot, so
      # their failures notify nobody. File an issue instead — that reaches the
      # owner via GitHub app/email. Comments on the existing open issue if one
      # is already tracking this, so repeated failures don't pile up issues.
      - name: File an issue so the failure is noticed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Pages deploy failed"' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "재시도 포함 또 실패했습니다: $run_url"
          else
            body=$(printf '%s\n' \
              "build-and-deploy가 재시도까지 실패해 사이트에 최신 데이터가 반영되지 않았습니다." \
              "" \
              "- 실패 런: $run_url" \
              "- 조치: Actions 탭 → build-and-deploy → 'Run workflow'로 재실행하거나, 실패 런에서 'Re-run failed jobs'를 누르세요.")
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Pages deploy failed — 수동 조치 필요" \
              --body "$body"
          fi
