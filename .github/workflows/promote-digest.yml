name: promote-digest

# The daily-digest cloud routine builds the digest every morning, but its scheduled
# runs cannot push to main (no push credential), so the work lands on a fresh
# claude/vigilant-keller-* branch each run. GitHub Pages only deploys main, so those
# digests never went live. This workflow promotes the routine's outputs from such a
# branch onto main, independent of the routine's token:
#   - data/digest-status.json (heartbeat) is ALWAYS taken, so main records that the
#     routine ran and whether it had anything to publish ("updated" vs "no-new-items").
#   - data/digest.json + data/archive.json are taken only when the branch's digest is
#     strictly newer, so re-runs / older branches don't churn main.
# data/news.json is never touched (the routine branch rewinds it; deploy owns that file).
#
# NOTE: the branch pattern must match the routine's working-branch base. If the routine
# is recreated under a different name, update the pattern below (see its git_info.branches).
on:
  push:
    branches:
      - "claude/vigilant-keller-*"

permissions:
  contents: write   # commit promoted files onto main
  actions: write    # dispatch the deploy workflow

concurrency:
  group: promote-digest
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Bring the triggering commit's objects in so we can read its files.
      - name: Fetch the routine branch tip
        run: git fetch --depth=1 origin "$GITHUB_SHA"

      - name: Take routine outputs from the branch
        run: |
          set -euo pipefail
          # Heartbeat: always take the status file when the branch carries one.
          if git cat-file -e "$GITHUB_SHA:data/digest-status.json" 2>/dev/null; then
            git checkout "$GITHUB_SHA" -- data/digest-status.json
          fi
          # Digest: take it only when the branch's is STRICTLY NEWER than main's.
          # ISO-8601 UTC 'Z' timestamps compare correctly as strings.
          newer=$(python3 - "$GITHUB_SHA" <<'PY'
          import json, subprocess, sys
          def read_updated(ref):
              try:
                  return json.loads(subprocess.check_output(["git", "show", f"{ref}:data/digest.json"]))["updated"]
              except Exception:
                  return ""
          new = read_updated(sys.argv[1])
          old = read_updated("HEAD")
          print("true" if new and new > old else "false")
          PY
          )
          if [ "$newer" = "true" ]; then
            git checkout "$GITHUB_SHA" -- data/digest.json data/archive.json
            python3 -c "import json; json.load(open('data/digest.json')); json.load(open('data/archive.json'))"
          fi
          echo "digest_promoted=$newer" >> "$GITHUB_ENV"
          echo "branch digest strictly newer than main: $newer"

      - name: Commit whatever changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "nothing to promote"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if [ "$digest_promoted" = "true" ]; then
            git commit -m "chore: update daily digest"
          else
            git commit -m "chore: digest heartbeat"
          fi
          git push origin HEAD:main
          echo "promoted=1" >> "$GITHUB_ENV"

      # A push made with GITHUB_TOKEN does not trigger the deploy workflow's on:push,
      # so kick it off explicitly to publish the promoted files right away.
      - name: Trigger deploy
        if: env.promoted == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
