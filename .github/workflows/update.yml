name: update-content

# Static site, so the "batch" lives here: GitHub Actions regenerates the data
# files and commits them back to main. Pages then redeploys automatically.
on:
  schedule:
    - cron: "0 */6 * * *"        # every 6 hours (UTC)
  push:
    branches: [main]
    paths:                        # rebuild immediately when I add notes / change scripts
      - "notes/**"
      - "scripts/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:              # manual "Run workflow" button

permissions:
  contents: write                 # needed to push the regenerated data/ back

concurrency:
  group: update-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news (RSS)
        run: python scripts/fetch_news.py

      - name: Build notes (Markdown)
        run: python scripts/build_notes.py

      - name: Commit data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "chore: refresh news/notes data [skip ci]"
            git push
          fi
